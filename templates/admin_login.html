<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Green Alert</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(45deg, #24c77b, #45afd2c1, rgb(179, 216, 68));
            font-family: Arial, sans-serif;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            background: white;
            padding: 25px 35px 30px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 380px;
            transform: scale(1.15);
        }

        .back-nav {
            display: flex;
            justify-content: flex-start;
            margin-bottom: 5px;
        }

        .back-home-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background-color: #2e8b57;
            color: #ffffff;
            text-decoration: none;
            padding: 7px 14px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            border: none;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .back-home-btn::before {
            content: "← ";
            font-size: 14px;
        }

        .back-home-btn:hover {
            background-color: #256d46;
            color: #ffffff;
            text-decoration: none;
        }

        .back-home-btn:active {
            transform: scale(0.98);
        }

        h2 {
            text-align: center;
            color: #2e8b57;
            margin-top: 5px;
            margin-bottom: 20px;
        }

        input[type="email"], input[type="password"] {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #2e8b57;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 5px;
        }

        button:hover {
            background-color: #256d46;
        }

        .error {
            color: red;
            text-align: center;
            margin-bottom: 10px;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px;
            }

            .login-container {
                transform: none;
                max-width: 100%;
                padding: 20px 20px 25px;
            }

            .back-home-btn {
                font-size: 13px;
                padding: 6px 12px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="back-nav">
            <a href="{{ url_for('home') }}" class="back-home-btn" id="back-to-home" role="button">Back to Home</a>
        </div>
        <h2>Admin Login</h2>
        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}
        <form method="POST">
            <input type="email" name="email" placeholder="Admin Email" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
