<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Department Login - Green Alert</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f0fff4;
      font-family: 'Segoe UI', sans-serif;
    }
    .main-heading {
      font-size: 42px;
      font-weight: 700;
      color: #006400;
      margin-bottom: 50px;
    }
    .container {
      margin-top: 80px;
    }
    .card {
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.15);
      background-color: #ffffff;
      transition: transform 0.2s ease-in-out;
    }
    .card:hover {
      transform: scale(1.03);
    }
    h4 {
      margin-bottom: 15px;
      color: #333333;
    }
    .form-control {
      border-radius: 8px;
    }
    .btn {
      border-radius: 10px;
      font-weight: 500;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px 0 40px;
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <a href="{{ url_for('home') }}" class="btn btn-outline-secondary btn-sm">Home</a>
  </div>

  <div class="container text-center">
    <h1 class="main-heading">Department Login</h1>

    <div class="row g-5 justify-content-center">

      <!-- Sanitation Department -->
      <div class="col-md-6 col-lg-3">
        <div class="card">
          <h4>Sanitation</h4>
          <form action="{{ url_for('department_login') }}" method="POST">
            <input type="email" name="email" class="form-control mb-2" placeholder="Email" required>
            <input type="password" name="password" class="form-control mb-2" placeholder="Password" required>
            <button type="submit" class="btn btn-success w-100">Login</button>
          </form>
        </div>
      </div>

      <!-- Water Department -->
      <div class="col-md-6 col-lg-3">
        <div class="card">
          <h4>Water</h4>
          <form action="{{ url_for('department_login') }}" method="POST">
            <input type="email" name="email" class="form-control mb-2" placeholder="Email" required>
            <input type="password" name="password" class="form-control mb-2" placeholder="Password" required>
            <button type="submit" class="btn btn-primary w-100">Login</button>
          </form>
        </div>
      </div>

      <!-- Pollution Control -->
      <div class="col-md-6 col-lg-3">
        <div class="card">
          <h4>Pollution</h4>
          <form action="{{ url_for('department_login') }}" method="POST">
            <input type="email" name="email" class="form-control mb-2" placeholder="Email" required>
            <input type="password" name="password" class="form-control mb-2" placeholder="Password" required>
            <button type="submit" class="btn btn-warning w-100 text-dark">Login</button>
          </form>
        </div>
      </div>

      <!-- Forest Department -->
      <div class="col-md-6 col-lg-3">
        <div class="card">
          <h4>Forest</h4>
          <form action="{{ url_for('department_login') }}" method="POST">
            <input type="email" name="email" class="form-control mb-2" placeholder="Email" required>
            <input type="password" name="password" class="form-control mb-2" placeholder="Password" required>
            <button type="submit" class="btn btn-dark w-100">Login</button>
          </form>
        </div>
      </div>

    </div>
  </div>
</body>
</html>
