<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Login</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(45deg, #9aecec, #67e98a, rgb(86, 181, 218));
            font-family: Arial, sans-serif;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .login-box {
            background: white;
            padding: 25px 35px 30px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            text-align: center;
            width: 100%;
            max-width: 380px;
            transform: scale(1.15);
        }

        .back-nav {
            display: flex;
            justify-content: flex-start;
            margin-bottom: 5px;
        }

        .back-home-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background-color: #2e8b57;
            color: #ffffff;
            text-decoration: none;
            padding: 7px 14px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            border: none;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .back-home-btn::before {
            content: "← ";
            font-size: 14px;
        }

        .back-home-btn:hover {
            background-color: #256d46;
            color: #ffffff;
            text-decoration: none;
        }

        .back-home-btn:active {
            transform: scale(0.98);
        }

        h2 {
            text-align: center;
            color: #2e8b57;
            margin-top: 5px;
            margin-bottom: 20px;
        }

        input[type="email"], input[type="password"] {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #2e8b57;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 5px;
        }

        button:hover {
            background-color: #256d46;
        }

        .error {
            color: red;
            margin-bottom: 10px;
            font-size: 14px;
            text-align: center;
        }

        .success {
            color: #155724;
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 10px;
            font-size: 14px;
            text-align: center;
        }

        p {
            margin-top: 15px;
            font-size: 14px;
        }

        p a {
            color: #2e8b57;
            text-decoration: none;
            font-weight: bold;
        }

        p a:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px;
            }

            .login-box {
                transform: none;
                max-width: 100%;
                padding: 20px 20px 25px;
            }

            .back-home-btn {
                font-size: 13px;
                padding: 6px 12px;
            }
        }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="back-nav">
            <a href="{{ url_for('home') }}" class="back-home-btn" id="back-to-home" role="button">Back to Home</a>
        </div>
        <h2>User Login</h2>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="{{ 'success' if category == 'success' else 'error' }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('login') }}" method="POST">
            <input type="email" name="email" placeholder="Enter your email" value="{{ email or '' }}" required>
            <input type="password" name="password" placeholder="Enter your password" required>
            <button type="submit">Login</button>
        </form>
        <p>Don't have an account? <a href="{{ url_for('register') }}">Register here</a></p>
    </div>
</body>
</html>
