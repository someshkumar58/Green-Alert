<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Green Alert - Register</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #e6fff2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            background: linear-gradient(180deg, #73c0d9a8, #5db109, #5bcfdaa8);
        }

        .register-container {
            background-color: white;
            padding: 25px 35px 30px;
            border-radius: 12px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 380px;
            transform: scale(1.15);
        }

        .back-nav {
            display: flex;
            justify-content: flex-start;
            margin-bottom: 5px;
        }

        .back-home-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background-color: #2e8b57;
            color: #ffffff;
            text-decoration: none;
            padding: 7px 14px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            border: none;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .back-home-btn::before {
            content: "← ";
            font-size: 14px;
        }

        .back-home-btn:hover {
            background-color: #256d46;
            color: #ffffff;
            text-decoration: none;
        }

        .back-home-btn:active {
            transform: scale(0.98);
        }

        h2 {
            text-align: center;
            color: #2e8b57;
            margin-top: 5px;
            margin-bottom: 20px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        button {
            background-color: #2e8b57;
            color: white;
            padding: 10px;
            width: 100%;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 5px;
        }

        button:hover {
            background-color: #256d46;
        }

        .message {
            text-align: center;
            color: red;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .success-message {
            text-align: center;
            color: #155724;
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .login-link {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

        .login-link a {
            color: #2e8b57;
            font-weight: bold;
            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px;
            }

            .register-container {
                transform: none;
                max-width: 100%;
                padding: 20px 20px 25px;
            }

            .back-home-btn {
                font-size: 13px;
                padding: 6px 12px;
            }
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="back-nav">
            <a href="{{ url_for('home') }}" class="back-home-btn" id="back-to-home" role="button">Back to Home</a>
        </div>
        <h2>User Registration</h2>

        {% if error %}
            <div class="message">{{ error }}</div>
        {% endif %}

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="{{ 'success-message' if category == 'success' else 'message' }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('register') }}" method="POST">
            <input type="text" name="name" placeholder="Full Name" value="{{ name or '' }}" required>
            <input type="email" name="email" placeholder="Email" value="{{ email or '' }}" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Register</button>
        </form>
        <p class="login-link">Already have an account? <a href="{{ url_for('login') }}">Login here</a></p>
    </div>
</body>
</html>
